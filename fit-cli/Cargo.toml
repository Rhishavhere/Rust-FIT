[package]
name = "fit-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fit-core = { path = "../fit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde"] }
json-patch = "1"
