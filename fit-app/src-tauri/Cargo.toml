[package]
name = "fit-app"
version = "0.1.0"
description = "FIT desktop — Tauri backend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fit-core = { path = "../../fit-core" }
hex = "0.4"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
json-patch = "1"
